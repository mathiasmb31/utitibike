<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="800"
   height="800"
   viewBox="0 0 800 800"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Background circle — bleu Utitibike (couleur primaire de l'app) -->
  <circle cx="400" cy="400" r="390" fill="#1278d0"/>

  <!-- Inner subtle ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Center: Utitibike bicycle icon -->
  <g transform="translate(400, 385)" stroke="#ffffff" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="-72" cy="42" r="36"/>
    <circle cx="72" cy="42" r="36"/>
    <!-- Frame -->
    <path d="M -72,42 L -4,42"/>
    <path d="M -72,42 L -24,-22"/>
    <path d="M -24,-22 L -4,42"/>
    <path d="M -24,-22 L 52,-14"/>
    <path d="M -4,42 L 52,-14"/>
    <path d="M 52,-14 L 72,42"/>
    <!-- Seat -->
    <path d="M -40,-28 L -12,-28" stroke-width="10"/>
    <!-- Stem + handlebar -->
    <path d="M 52,-14 L 62,-36"/>
    <path d="M 50,-42 L 76,-36"/>
    <!-- Pedal crank accent -->
    <circle cx="-4" cy="42" r="7" fill="#ffffff" stroke="none"/>
  </g>

</svg>

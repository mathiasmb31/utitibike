<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="800"
   height="800"
   viewBox="0 0 800 800"
   xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Circular text path for rotating text -->
    <path id="circle-text-path" d="
      M 400,400
      m -300,0
      a 300,300 0 1,1 600,0
      a 300,300 0 1,1 -600,0
    " fill="none"/>

    <!-- Reusable text on path -->
    <text id="circle-text" font-family="Ubuntu, Cantarell, sans-serif" font-size="74" font-weight="700" letter-spacing="0" fill="#ffffff" opacity="1.0">
      <textPath href="#circle-text-path" startOffset="0%">VIBE CODED &#x2022; HUMAN TESTED &#x2022; HUMAN VERIFIED &#x2022;&#160;</textPath>
    </text>
  </defs>

  <!-- Background circle — bleu Utitibike (couleur primaire de l'app, bannière navigation) -->
  <circle cx="400" cy="400" r="390" fill="#1278d0"/>

  <!-- Inner subtle ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Rotating text group -->
  <g>
    <use href="#circle-text"/>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 400 400"
      to="360 400 400"
      dur="20s"
      repeatCount="indefinite"
    />
  </g>

  <!-- Center: Utitibike bicycle icon -->
  <g transform="translate(400, 385)" stroke="#ffffff" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="-72" cy="42" r="36"/>
    <circle cx="72" cy="42" r="36"/>
    <!-- Frame -->
    <path d="M -72,42 L -4,42"/>
    <path d="M -72,42 L -24,-22"/>
    <path d="M -24,-22 L -4,42"/>
    <path d="M -24,-22 L 52,-14"/>
    <path d="M -4,42 L 52,-14"/>
    <path d="M 52,-14 L 72,42"/>
    <!-- Seat -->
    <path d="M -40,-28 L -12,-28" stroke-width="10"/>
    <!-- Stem + handlebar -->
    <path d="M 52,-14 L 62,-36"/>
    <path d="M 50,-42 L 76,-36"/>
    <!-- Pedal crank accent -->
    <circle cx="-4" cy="42" r="7" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Small decorative dots at cardinal points (static) -->
  <circle cx="400" cy="30" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="400" cy="770" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="30" cy="400" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="770" cy="400" r="5" fill="#ffffff" opacity="0.4"/>

</svg>

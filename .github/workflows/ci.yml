name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Checks rapides (~30 s) ──────────────────────────────────────────
  validate:
    name: Validate (manifest, versions, traductions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Validate manifest.json (JSON valide)
        run: python3 -c "import json; m=json.load(open('manifest.json')); print('OK:', m['name'], m['version'])"

      - name: Check version coherence (CMake ↔ manifest ↔ manifest.in)
        run: |
          cmake_ver=$(grep -oP 'project\(utitibike VERSION \K[0-9.]+' CMakeLists.txt)
          manifest_ver=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "CMakeLists.txt : $cmake_ver"
          echo "manifest.json  : $manifest_ver"
          [ "$cmake_ver" = "$manifest_ver" ] || { echo "MISMATCH: CMake vs manifest.json"; exit 1; }
          # manifest.json.in est un template CMake : la version y est @PROJECT_VERSION@
          grep -q '"version": "@PROJECT_VERSION@"' manifest.json.in \
            || { echo "MISMATCH: manifest.json.in n'utilise pas @PROJECT_VERSION@"; exit 1; }
          echo "Versions cohérentes."

      - name: Validate .po files (syntaxe gettext)
        run: |
          fail=0
          for f in po/utitibike_??.po po/utitibike-cpp_??.po; do
            [ -f "$f" ] || continue
            if ! msgfmt --check -o /dev/null "$f" 2>/dev/null; then
              echo "ERREUR: $f"
              msgfmt --check -o /dev/null "$f" || true
              fail=1
            else
              stats=$(msgfmt --statistics -o /dev/null "$f" 2>&1)
              echo "OK: $f ($stats)"
            fi
          done
          exit $fail

      - name: Validate .desktop file
        run: |
          grep -q "^Exec=" utitibike.desktop   || { echo "Manque Exec="; exit 1; }
          grep -q "^Icon=" utitibike.desktop   || { echo "Manque Icon="; exit 1; }
          grep -q "^Name=" utitibike.desktop   || { echo "Manque Name="; exit 1; }
          grep -q "^Type=Application" utitibike.desktop || { echo "Manque Type=Application"; exit 1; }
          echo "desktop OK"

      - name: Validate AppArmor profile (format JSON AppArmor 4)
        run: |
          python3 -c "
          import json
          with open('utitibike.apparmor') as f:
              p = json.load(f)
          assert 'policy_version' in p, 'Manque policy_version'
          assert 'policy_groups' in p, 'Manque policy_groups'
          print('apparmor OK:', p['policy_version'], '-', len(p['policy_groups']), 'groups')
          "

      - name: Check QML files referenced in qrc exist
        run: |
          fail=0
          for f in $(grep -oP '<file>\K[^<]+' qml.qrc); do
            [ -f "$f" ] || { echo "MANQUANT: $f (référencé dans qml.qrc)"; fail=1; }
          done
          exit $fail

      - name: Check all src/*.cpp are in CMakeLists.txt
        run: |
          fail=0
          for f in src/*.cpp; do
            grep -qF "$f" CMakeLists.txt || { echo "MANQUANT dans CMakeLists.txt: $f"; fail=1; }
          done
          exit $fail

      - name: Check all tests/*.cpp are in tests/CMakeLists.txt
        run: |
          fail=0
          for f in tests/tst_*.cpp; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            grep -qF "$base" tests/CMakeLists.txt || { echo "MANQUANT dans tests/CMakeLists.txt: $base"; fail=1; }
          done
          exit $fail

      - name: Check .pot templates are up to date (xgettext)
        run: |
          # Extrait les chaînes traduisibles du C++ et du QML, compare avec le .pot
          # On ne régénère pas le .pot (trop de diff), on vérifie juste qu'il existe
          # et qu'il contient des entrées.
          for pot in po/utitibike.pot po/utitibike-cpp.pot; do
            [ -f "$pot" ] || { echo "MANQUANT: $pot"; exit 1; }
            count=$(grep -c "^msgid " "$pot")
            [ "$count" -gt 5 ] || { echo "$pot semble vide ($count msgid)"; exit 1; }
            echo "OK: $pot ($count msgid)"
          done

  # ── cppcheck (analyse statique, ~1 min) ─────────────────────────────
  cppcheck:
    name: cppcheck (analyse statique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Install Qt5 dev (pour les includes cppcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qtbase5-dev qtdeclarative5-dev qtpositioning5-dev

      - name: Run cppcheck
        run: |
          QT_INC=$(pkg-config --cflags Qt5Core Qt5Gui Qt5Quick Qt5Network Qt5Positioning 2>/dev/null || true)
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr \
                   --std=c++17 \
                   --language=c++ \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=unknownMacro \
                   -DUTITIBIKE_VERSION=\"0.1.3\" \
                   -DQ_OS_LINUX \
                   -DQ_OS_UNIX \
                   -I src/ \
                   $QT_INC \
                   src/ 2>&1 | tee cppcheck-report.txt
          # On échoue sur les errors uniquement, pas les warnings
          if grep -qE "^[^:]+:[0-9]+:[0-9]+: error:" cppcheck-report.txt; then
            echo "ERREURS cppcheck détectées"
            exit 1
          fi
          echo "cppcheck OK (warnings acceptés)"

  # ── Build + tests C++ host x86_64 (~5-7 min) ────────────────────────
  build-host:
    name: Build + Test (host x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 dev + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qtbase5-dev qtdeclarative5-dev qtpositioning5-dev \
            qttools5-dev-tools gettext cmake g++ make

      - name: CMake configure (avec tests)
        run: |
          mkdir -p build-host && cd build-host
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build (app + tests)
        run: cmake --build build-host -j$(nproc)

      - name: Verify binary
        run: |
          test -f build-host/utitibike || { echo "Binaire non généré"; exit 1; }
          file build-host/utitibike
          echo "Build host OK"

      - name: Run unit tests
        working-directory: build-host
        run: ctest --output-on-failure --verbose

      - name: Verify translations built
        run: |
          ls build-host/*.mo 2>/dev/null | wc -l | xargs echo ".mo files:"
          ls build-host/*.qm 2>/dev/null | wc -l | xargs echo ".qm files:"

  # ── Build clickable ARM64 + review (~10-15 min) ─────────────────────
  build-click:
    name: Build click (ARM64) + review
    runs-on: ubuntu-latest
    container:
      image: clickable/ci-ut24.04-1.x-arm64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build click
        run: clickable build

      - name: Review click
        run: clickable review build/aarch64-linux-gnu/app/mathias.utitibike_*.click

      - name: Check click size (garde-fou < 50 Mo)
        run: |
          size=$(stat -c%s build/aarch64-linux-gnu/app/mathias.utitibike_*.click)
          size_mb=$((size / 1024 / 1024))
          echo "Taille du .click: ${size_mb} Mo ($size octets)"
          if [ "$size" -gt 52428800 ]; then
            echo "ALERTE: le .click dépasse 50 Mo"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: utitibike-click
          path: build/aarch64-linux-gnu/app/mathias.utitibike_*.click
          retention-days: 30
